name: LABUDA Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch Xray Android engine
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar
      - name: Normalize server names
        run: python3 scripts/clean_server_names.py
      - name: Apply 0.46 ping display fix
        run: python3 scripts/fix_046.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK to LABUDA version format
        shell: bash
        run: |
          VERSION=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/LABUDA${VERSION}.APK"
          echo "LABUDA_APK=LABUDA${VERSION}.APK" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LABUDA-${{ env.LABUDA_APK }}
          path: app/build/outputs/apk/debug/${{ env.LABUDA_APK }}
          if-no-files-found: error

name: LABUDA Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch Xray Android engine
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar
      - name: Fix 0.52 Kotlin source
        run: python3 scripts/fix_052_compile.py
      - name: Reduce server name font size
        run: |
          sed -i 's/Text(p.name,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f))/Text(p.name,fontWeight=FontWeight.Bold,fontSize=14.sp,modifier=Modifier.weight(1f))/' app/src/main/java/com/labuda/app/MainActivity.kt
      - name: Install Tele2 TextSans font
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail --retry 3 -o app/src/main/res/font/tele2_text_sans.ttf \
            https://db.onlinewebfonts.com/t/eaede26ebfc025d4b8715790660fbde9.ttf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/labuda/app/MainActivity.kt')
          s = p.read_text()
          old = 'MaterialTheme(colorScheme=if(dark)darkColorScheme()else lightColorScheme()){'
          new = 'MaterialTheme(colorScheme=if(dark)darkColorScheme()else lightColorScheme(),typography=Tele2Typography){'
          if old not in s:
              raise SystemExit('MaterialTheme target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply subscription and statistics UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/labuda/app/MainActivity.kt')
          s = p.read_text()
          replacements = [
              ('Text(s.title,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f))', 'Text("Подписка",fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f))'),
              ('storedComment.ifBlank{selectedComment}', 'selectedComment'),
              ('o.optLong("total",-1).takeIf{it>=0}', 'o.optLong("total",-1).takeIf{it>0}'),
              ('m["total"],m["expire"]', 'm["total"]?.takeIf{it>0},m["expire"]'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Set LABUDA version from Actions run number
        shell: bash
        run: |
          SUFFIX=$((GITHUB_RUN_NUMBER % 100))
          VERSION="1.$(printf '%02d' "$SUFFIX")"
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          echo "LABUDA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building LABUDA $VERSION from Actions run #$GITHUB_RUN_NUMBER"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK to LABUDA version format
        shell: bash
        run: |
          VERSION="$LABUDA_VERSION"
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/LABUDA${VERSION}.APK"
          echo "LABUDA_APK=LABUDA${VERSION}.APK" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LABUDA-${{ env.LABUDA_APK }}
          path: app/build/outputs/apk/debug/${{ env.LABUDA_APK }}
          if-no-files-found: error

name: LABUDA Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch Xray Android engine
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar
      - name: Install Oswald font
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail --retry 3 -o app/src/main/res/font/oswald.ttf \
            https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf
      - name: Fix legacy Kotlin compile compatibility
        run: python3 scripts/fix_052_compile.py
      - name: Reduce server name font size
        run: |
          sed -i 's/Text(p.name,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f))/Text(p.name,fontWeight=FontWeight.Bold,fontSize=14.sp,modifier=Modifier.weight(1f))/' app/src/main/java/com/labuda/app/MainActivity.kt
      - name: Apply Oswald typography
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ['MainActivity.kt', 'SettingsActivity.kt']:
              p = Path('app/src/main/java/com/labuda/app') / name
              s = p.read_text()
              s = s.replace('Tele2Typography', 'OswaldTypography')
              if name == 'MainActivity.kt' and 'OswaldTypography' not in s:
                  pattern = r'MaterialTheme\(colorScheme=if\(dark\)darkColorScheme\(\)else lightColorScheme\(\)'
                  s, n = re.subn(pattern, 'MaterialTheme(colorScheme=if(dark)darkColorScheme()else lightColorScheme(),typography=OswaldTypography', s, count=1)
                  if n != 1:
                      raise SystemExit('MaterialTheme target not found; inspect current source before patching')
              p.write_text(s)
          PY
      - name: Apply subscription and statistics UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/labuda/app/MainActivity.kt')
          s = p.read_text()
          replacements = [
              ('Text(s.title,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f))', 'Text("Подписка",fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f))'),
              ('storedComment.ifBlank{selectedComment}', 'selectedComment'),
              ('o.optLong("total",-1).takeIf{it>=0}', 'o.optLong("total",-1).takeIf{it>0}'),
              ('m["total"],m["expire"]', 'm["total"]?.takeIf{it>0},m["expire"]'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Create ephemeral CI release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/labuda-release.jks" \
            -storepass labuda-ci-pass \
            -keypass labuda-ci-pass \
            -alias labuda-ci \
            -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=LABUDA CI,O=LABUDA"
          echo "LABUDA_KEYSTORE_PATH=$RUNNER_TEMP/labuda-release.jks" >> "$GITHUB_ENV"
          echo "LABUDA_KEYSTORE_PASSWORD=labuda-ci-pass" >> "$GITHUB_ENV"
          echo "LABUDA_KEY_ALIAS=labuda-ci" >> "$GITHUB_ENV"
          echo "LABUDA_KEY_PASSWORD=labuda-ci-pass" >> "$GITHUB_ENV"
      - name: Build protected release APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify protected APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'classes.dex'
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/LABUDA1.0.0.0.APK
      - name: Upload protected APK
        uses: actions/upload-artifact@v4
        with:
          name: LABUDA-1.0.0.0
          path: app/build/outputs/apk/release/LABUDA1.0.0.0.APK
          if-no-files-found: error

name: LABUDA Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, labuda-android-8-updates ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private keys and common credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI --cached '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16}' -- ':!*.md'; then
            echo 'Potential secret detected in tracked source.'
            exit 1
          fi
          if git grep -nEI 'storePassword[[:space:]]*=[[:space:]]*"[^"]+"|keyPassword[[:space:]]*=[[:space:]]*"[^"]+"' -- '*.gradle' '*.gradle.kts'; then
            echo 'Hard-coded signing credential detected.'
            exit 1
          fi

  build-debug:
    name: Reproducible debug build gate
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch pinned Xray engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar
          test -s app/libs/libv2ray.aar
      - name: Validate and stabilize Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/fix_052_compile.py
          python3 scripts/fix_052_compile.py
          python3 scripts/optimize_runtime.py
          test -f app/src/main/java/com/labuda/app/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/labuda/app/MainActivity.kt')
          s = p.read_text()
          assert '@Composable\nprivate fun LabudaApp' in s, 'LabudaApp stabilization was not applied'
          assert '\nprivate fun normalizeSubscriptionTitle' in s, 'MainActivity structure is incomplete'
          assert 'runBlocking' not in s, 'Main-thread blocking code remains'
          print('Kotlin source preflight: OK')
          PY
      - name: Build
        run: gradle --no-daemon clean --stacktrace assembleDebug

  release-signing-gate:
    name: Secure release signing gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [secret-scan, build-debug]
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore signing key only in runner memory/filesystem
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LABUDA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/labuda-release.jks"
          test -s "$RUNNER_TEMP/labuda-release.jks"
      - name: Fetch Xray engine
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar
      - name: Validate and stabilize Kotlin sources
        run: |
          python3 scripts/fix_052_compile.py
          python3 scripts/optimize_runtime.py
      - name: Build signed release
        env:
          LABUDA_KEYSTORE_PATH: ${{ runner.temp }}/labuda-release.jks
          LABUDA_KEYSTORE_PASSWORD: ${{ secrets.LABUDA_KEYSTORE_PASSWORD }}
          LABUDA_KEY_ALIAS: ${{ secrets.LABUDA_KEY_ALIAS }}
          LABUDA_KEY_PASSWORD: ${{ secrets.LABUDA_KEY_PASSWORD }}
        run: gradle --no-daemon clean --stacktrace assembleRelease
      - name: Delete signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/labuda-release.jks"
